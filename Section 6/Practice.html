<!doctype html>
<html lang="en">
<head>
    <title>Section 6</title>
    <style>
        .form-group{
            margin-bottom: 100px;
        }
    </style>
</head>
<body>
    <form method="get">
        <label for="name">Name:</label>
        <input id="name" type="text" name="name" required placeholder="Please Enter Your Name">
        <br>
        <br>

        <label>Password:</label>
        <input type="password" name="password">
        <br>
        <br>

        <label>Email:</label>
        <input type="email" name="email">
        <br>
        <br>

        <input type="number" name="age" min="1" max="100">
        <br>
        <br>
        <input type="date" name="birth_date">
        <br>
        <br>

        <input id="male" type="radio" name="gender" value="M">
        <label for="male">Male</label>
        <input id="female" type="radio" name="gender" value="F">
        <label for="female">Female</label>
    <br>
    <br>
        <input type="checkbox" name="courses" value="DB">
        <label>Database</label>
        <input type="checkbox" name="courses" value="IA">
        <label>Internet Applications</label>

        <br>
        <br>
        <label>Nationality</label>
        <select name="country">
            <option value="egy">Egypt</option>
            <option value="usa">USA</option>
        </select>

        <br>
        <br>

        <label for="message">Your message:</label>
        <textarea id="message" name="message" rows="5" placeholder="Write here..."></textarea>
        <br>
        <br>

        <div class="form-group">
            <label for="city">City:</label>
            <input type="text" id="city" name="city">
        </div>

        <button type="submit">Submit</button>

    </form>
</body>
</html>
